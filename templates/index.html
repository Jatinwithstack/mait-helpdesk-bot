<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAIT Helpdesk AI Chatbot | Maharaja Agrasen Institute of Technology</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="chat-page">

  <!-- Header -->
  <header class="chat-header">
    <div class="brand-wrapper">
      <div class="logo-badge">MAIT</div>
      <div class="brand-details">
        <h1>MAIT Helpdesk AI</h1>
        <p><span class="status-dot"></span> Online &bull; Maharaja Agrasen Institute of Technology, Delhi</p>
      </div>
    </div>
    <div class="header-links">
      <a href="{{ url_for('admin_login') }}" title="Staff Portal">Admin Portal</a>
    </div>
  </header>

  <!-- Chat History -->
  <main class="chat-container" id="chatContainer">
    <!-- Welcome message from bot -->
    <div class="message-row bot">
      <div class="avatar bot-avatar">AI</div>
      <div class="message-bubble">
        Hello! I am your <strong>MAIT College Helpdesk Assistant</strong>.<br>
        Ask me anything regarding college fees, exam schedules, class timetables, attendance rules, notices, hostel, library, or campus placements.
        <br>
        <span class="category-tag">Welcome</span>
      </div>
    </div>
  </main>

  <!-- Footer with Quick Chips and Input -->
  <footer class="chat-footer">
    <div class="quick-chips-wrapper" id="quickChips">
      <button class="chip-btn" onclick="sendChipMessage('How can I pay my annual academic fees at MAIT?')">Fees</button>
      <button class="chip-btn" onclick="sendChipMessage('When are the IPU end-term semester examinations held?')">Exam Schedule</button>
      <button class="chip-btn" onclick="sendChipMessage('Where can I find my semester class timetable?')">Timetable</button>
      <button class="chip-btn" onclick="sendChipMessage('What is the minimum attendance requirement to appear for exams?')">Attendance</button>
      <button class="chip-btn" onclick="sendChipMessage('Where can I check official circulars and notices?')">Notices</button>
    </div>

    <form class="input-bar" id="chatForm" onsubmit="handleChatSubmit(event)">
      <input 
        type="text" 
        id="userInput" 
        class="chat-input" 
        placeholder="Type your question about MAIT here..." 
        autocomplete="off"
        required
      />
      <button type="submit" id="sendBtn" class="send-btn">
        <span>Send</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>
  </footer>

  <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
